<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GravityDesk Console</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --card: #141414;
      --border: #262626;
      --text: #cccccc;
      --text-muted: #737373;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Minimal Top Header */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
    }
    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 6px rgba(63, 185, 80, 0.6);
    }

    .folder-chip {
      background: #1e1e1e;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--accent);
      font-family: "Cascadia Code", Consolas, monospace;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .vitals-text {
      font-size: 11px;
      color: var(--text-muted);
      font-family: "Cascadia Code", Consolas, monospace;
    }
    .vitals-text span { color: #e5e5e5; }

    /* Edge-to-Edge Pure Terminal */
    #terminal-screen {
      flex: 1;
      background: var(--bg);
      padding: 8px 10px;
      overflow-y: auto;
      overflow-x: hidden;
      font-family: "Cascadia Code", Consolas, Menlo, "Courier New", monospace;
      font-size: 12.5px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
      color: #cccccc;
    }

    .term-line {
      display: block;
      min-height: 1.4em;
    }

    /* Terminal SGR Colors */
    .c-30 { color: #484f58; }
    .c-31 { color: #f85149; }
    .c-32 { color: #3fb950; }
    .c-33 { color: #d29922; }
    .c-34 { color: #58a6ff; }
    .c-35 { color: #bc8cff; }
    .c-36 { color: #39c5cf; }
    .c-37 { color: #e6edf3; }
    .c-90 { color: #6e7681; }
    .c-91 { color: #ffa198; }
    .c-92 { color: #56d364; }
    .c-93 { color: #e3b341; }
    .c-94 { color: #79c0ff; }
    .c-95 { color: #d2a8ff; }
    .c-96 { color: #56d4dd; }
    .c-97 { color: #ffffff; }
    .t-bold { font-weight: 700; }

    /* Quick Action Keys */
    .quick-bar {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 5px 10px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .key-btn {
      background: #1e1e1e;
      border: 1px solid var(--border);
      color: #e5e5e5;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: "Cascadia Code", Consolas, monospace;
      cursor: pointer;
      flex-shrink: 0;
    }
    .key-btn:active { background: var(--accent); color: #fff; }
    .btn-ctrlc { color: var(--danger); border-color: rgba(248, 81, 73, 0.4); }

    /* Input Dock */
    .input-dock {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .mic-btn {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #1e1e1e;
      border: 1px solid var(--border);
      color: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mic-btn.recording {
      background: var(--danger);
      color: #fff;
    }

    .input-prefix {
      font-family: "Cascadia Code", Consolas, monospace;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    .term-input {
      flex: 1;
      background: #0c0c0c;
      border: 1px solid var(--border);
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-family: "Cascadia Code", Consolas, monospace;
      outline: none;
    }
    .term-input:focus { border-color: var(--accent); }

    .send-btn {
      background: #1f6feb;
      color: #ffffff;
      border: none;
      padding: 0 14px;
      height: 36px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Simple Folder Picker Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }
    .modal-body {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      font-size: 12px;
    }
    .folder-row {
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: "Cascadia Code", Consolas, monospace;
    }
    .folder-row:hover { background: #1e1e1e; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand-row">
      <span class="status-dot" id="status-dot"></span>
      <span class="brand">GravityDesk</span>
      <div class="folder-chip" id="folder-chip" onclick="openFolderModal()">
        📁 <span id="folder-name">Select Folder</span>
      </div>
    </div>
    <div class="vitals-text">
      Bat: <span id="v-bat">-</span> | CPU: <span id="v-cpu">-</span>
    </div>
  </header>

  <!-- Edge-to-Edge Clean Terminal Screen -->
  <div id="terminal-screen"></div>

  <!-- Quick Shortcut Keys -->
  <div class="quick-bar">
    <button class="key-btn btn-ctrlc" onclick="sendSignal('SIGINT')">Ctrl+C</button>
    <button class="key-btn" onclick="sendInput('y\n')">Yes (y)</button>
    <button class="key-btn" onclick="sendInput('n\n')">No (n)</button>
    <button class="key-btn" onclick="sendInput('\n')">Enter ↵</button>
    <button class="key-btn" onclick="clearTerminal()">Clear</button>
    <button class="key-btn" onclick="scrollToBottom()">Bottom ↓</button>
  </div>

  <!-- Input Dock -->
  <div class="input-dock">
    <button id="mic-btn" class="mic-btn" title="Voice Input" onclick="toggleVoice()">🎙️</button>
    <span class="input-prefix" style="color:var(--success);font-weight:700;font-size:12px;">prompt&gt;</span>
    <input type="text" id="term-input" class="term-input" placeholder="Type message or command..." autocomplete="off" />
    <button class="send-btn" onclick="sendPrompt()">Send</button>
  </div>

  <!-- Minimal Folder Picker Modal -->
  <div id="folder-modal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <span>Select Folder</span>
        <button onclick="closeFolderModal()" style="background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <div style="color:var(--text-muted);margin-bottom:6px;font-size:11px;">FAVORITES</div>
        <div id="fav-list" style="display:flex;flex-direction:column;gap:3px;margin-bottom:12px;"></div>
        <div style="color:var(--text-muted);margin-bottom:6px;font-size:11px;">DRIVES &amp; FOLDERS</div>
        <div id="bc-bar" style="margin-bottom:8px;color:var(--accent);font-family:monospace;font-size:11px;"></div>
        <div id="dir-list" style="display:flex;flex-direction:column;gap:2px;"></div>
      </div>
      <div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;">
        <button class="key-btn" onclick="toggleFavorite()">⭐ Pin Favorite</button>
        <button class="send-btn" style="height:32px;" onclick="chooseCurrentFolder()">Select This Folder</button>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let currentSeq = 0;
    let activePath = "";
    let token = new URLSearchParams(window.location.search).get("token") || "";

    const terminalScreen = document.getElementById("terminal-screen");
    const statusDot = document.getElementById("status-dot");
    const folderNameEl = document.getElementById("folder-name");
    const termInput = document.getElementById("term-input");
    const micBtn = document.getElementById("mic-btn");

    // Line Buffer for Terminal Output (handles \r in-place overwrite for spinners)
    const MAX_LINES = 1500;
    let lines = [""];

    // ANSI SGR Color Parser (converts ANSI escape sequence to HTML spans)
    function ansiToHtml(str) {
      let html = "";
      let currentColorClass = "";
      let isBold = false;
      const regex = /\x1B\[([0-9;]*)m/g;
      let lastIndex = 0;
      let match;

      while ((match = regex.exec(str)) !== null) {
        const textBefore = str.slice(lastIndex, match.index);
        if (textBefore) {
          const escaped = escapeHtml(textBefore);
          const classes = [currentColorClass, isBold ? "t-bold" : ""].filter(Boolean).join(" ");
          html += classes ? `<span class="${classes}">${escaped}</span>` : escaped;
        }

        const codes = (match[1] || "0").split(";").map(c => parseInt(c, 10));
        for (const code of codes) {
          if (code === 0) {
            currentColorClass = "";
            isBold = false;
          } else if (code === 1) {
            isBold = true;
          } else if (code >= 30 && code <= 37) {
            currentColorClass = `c-${code}`;
          } else if (code >= 90 && code <= 97) {
            currentColorClass = `c-${code}`;
          }
        }
        lastIndex = regex.lastIndex;
      }

      const remaining = str.slice(lastIndex);
      if (remaining) {
        const escaped = escapeHtml(remaining);
        const classes = [currentColorClass, isBold ? "t-bold" : ""].filter(Boolean).join(" ");
        html += classes ? `<span class="${classes}">${escaped}</span>` : escaped;
      }

      return html;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderActiveLines() {
      // Fast DOM update: filter out boilerplate / noise lines
      const validLines = lines.filter((line, i) => {
        const trimmed = line.trim();
        if (!trimmed && i === 0) return false;
        const lower = trimmed.toLowerCase();
        if (lower.includes("microsoft windows [version")) return false;
        if (lower.includes("(c) microsoft corporation")) return false;
        if (lower.includes("all rights reserved")) return false;
        return true;
      });

      terminalScreen.innerHTML = validLines
        .map(line => `<div class="term-line">${ansiToHtml(line)}</div>`)
        .join("");
      scrollToBottom();
    }

    function processIncomingData(chunk) {
      // 1. Strip OSC Window Title sequences (\x1B]0;...\x07)
      chunk = chunk.replace(/(\x1B\]|\x9D)[0-9;]*[^\x07\x1B\r\n]*(\x07|\x1B\\)?/g, "");
      // 2. Strip all ANSI control sequences (cursor pos, erase line, etc.) except SGR color (m)
      chunk = chunk.replace(/\x1B\[[0-9;?]*[A-LN-Za-ln-z]/g, "");
      // 3. Strip stray literal bracket control codes if \x1B was dropped (e.g. [0K, [2K, [?25h)
      chunk = chunk.replace(/\[[0-9;?]*[A-LN-Za-ln-z]/g, "");
      // 4. Strip Windows OS copyright and version strings
      chunk = chunk.replace(/Microsoft Windows \[Version[^\]]+\]/gi, "");
      chunk = chunk.replace(/\(c\) Microsoft Corporation[^\r\n]*/gi, "");
      chunk = chunk.replace(/All rights reserved[^\r\n]*/gi, "");

      let lineUpdated = false;

      for (let i = 0; i < chunk.length; i++) {
        const ch = chunk[i];

        if (ch === "\r") {
          // If followed by \n, let \n create the new line
          if (i + 1 < chunk.length && chunk[i + 1] === "\n") {
            continue;
          }
          // Standalone carriage return (\r): Overwrite the current active line in-place!
          lines[lines.length - 1] = "";
          lineUpdated = true;
        } else if (ch === "\n") {
          // New line
          lines.push("");
          if (lines.length > MAX_LINES) lines.shift();
          lineUpdated = true;
        } else {
          lines[lines.length - 1] += ch;
          lineUpdated = true;
        }
      }

      if (lineUpdated) {
        renderActiveLines();
      }
    }

    function connectWS() {
      const loc = window.location;
      const proto = loc.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${proto}//${loc.host}/ws/terminal?token=${token}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusDot.className = "status-dot online";
        ws.send(JSON.stringify({ type: "subscribe", last_seq: currentSeq }));
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "output") {
          currentSeq = msg.seq;
          processIncomingData(msg.data);
        }
      };

      ws.onclose = () => {
        statusDot.className = "status-dot";
        setTimeout(connectWS, 2000);
      };

      ws.onerror = () => ws.close();
    }

    function sendPrompt() {
      const text = termInput.value.trim();
      if (!text) return;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "stdin", data: text + "\r\n" }));
        termInput.value = "";
      }
    }

    function sendInput(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "stdin", data: data }));
      }
    }

    function sendSignal(sig) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "signal", signal: sig }));
      }
    }

    function clearTerminal() {
      lines = ["\x1b[36mAGY>\x1b[0m Ready.", "\x1b[32mprompt>\x1b[0m "];
      renderActiveLines();
    }

    function scrollToBottom() {
      terminalScreen.scrollTop = terminalScreen.scrollHeight;
    }

    termInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendPrompt();
    });

    // Telemetry Polling
    async function fetchVitals() {
      try {
        const res = await fetch(`/api/health?token=${token}`);
        if (res.ok) {
          const d = await res.json();
          document.getElementById("v-cpu").innerText = `${d.cpu_percent}%`;
          if (d.battery) {
            const bolt = d.battery.is_charging ? "⚡" : "";
            document.getElementById("v-bat").innerText = `${bolt}${d.battery.percent}%`;
          }
          if (d.active_session && d.active_session.cwd && !activePath) {
            activePath = d.active_session.cwd;
            updateFolderLabel(activePath);
          }
        }
      } catch (err) {}
    }

    function updateFolderLabel(p) {
      const name = p.split(/[\\/]/).filter(Boolean).pop() || p;
      folderNameEl.innerText = name;
      folderNameEl.title = p;
    }

    // Voice Input (Web Speech API)
    let recognition = null;
    let isRecording = false;

    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = "id-ID";

      recognition.onresult = (e) => {
        let t = "";
        for (let i = e.resultIndex; i < e.results.length; ++i) t += e.results[i][0].transcript;
        termInput.value = t;
      };
      recognition.onend = () => stopVoice();
      recognition.onerror = () => stopVoice();
    } else {
      micBtn.style.display = "none";
    }

    function toggleVoice() {
      if (!recognition) return;
      if (isRecording) {
        recognition.stop();
        stopVoice();
      } else {
        recognition.start();
        isRecording = true;
        micBtn.classList.add("recording");
      }
    }
    function stopVoice() {
      isRecording = false;
      micBtn.classList.remove("recording");
    }

    // Folder Modal
    let modalPath = "";
    async function openFolderModal() {
      document.getElementById("folder-modal").classList.add("open");
      loadFavorites();
      loadDirectory(activePath || "");
    }
    function closeFolderModal() {
      document.getElementById("folder-modal").classList.remove("open");
    }

    async function loadFavorites() {
      const res = await fetch(`/api/favorites?token=${token}`);
      const favs = await res.json();
      const listEl = document.getElementById("fav-list");
      listEl.innerHTML = "";
      favs.forEach((f) => {
        const div = document.createElement("div");
        div.className = "folder-row";
        div.innerHTML = `⭐ <span>${f.name}</span> <span style="margin-left:auto;color:var(--text-muted);font-size:10px;">${f.path}</span>`;
        div.onclick = () => {
          activePath = f.path;
          updateFolderLabel(activePath);
          closeFolderModal();
          switchSessionDir(activePath);
        };
        listEl.appendChild(div);
      });
    }

    async function loadDirectory(p) {
      const res = await fetch(`/api/workspaces?path=${encodeURIComponent(p)}&token=${token}`);
      const data = await res.json();
      modalPath = data.current_path;

      const bcEl = document.getElementById("bc-bar");
      bcEl.innerHTML = "";
      data.breadcrumbs.forEach((b, i) => {
        const s = document.createElement("span");
        s.style.cursor = "pointer";
        s.innerText = b.name + (i < data.breadcrumbs.length - 1 ? " / " : "");
        s.onclick = () => loadDirectory(b.path);
        bcEl.appendChild(s);
      });

      const dirEl = document.getElementById("dir-list");
      dirEl.innerHTML = "";
      data.entries.forEach((e) => {
        const div = document.createElement("div");
        div.className = "folder-row";
        div.innerHTML = `📁 <span>${e.name}</span>`;
        div.onclick = () => loadDirectory(e.path);
        dirEl.appendChild(div);
      });
    }

    async function switchSessionDir(p) {
      await fetch(`/api/workspaces/select?path=${encodeURIComponent(p)}&token=${token}`, {
        method: "POST"
      });
    }

    function chooseCurrentFolder() {
      activePath = modalPath;
      updateFolderLabel(activePath);
      closeFolderModal();
      switchSessionDir(activePath);
    }

    async function toggleFavorite() {
      await fetch(`/api/favorites/toggle?path=${encodeURIComponent(modalPath)}&token=${token}`, { method: "POST" });
      loadFavorites();
    }

    // Initialize
    window.addEventListener("DOMContentLoaded", () => {
      connectWS();
      fetchVitals();
      setInterval(fetchVitals, 3000);
    });
  </script>
</body>
</html>
