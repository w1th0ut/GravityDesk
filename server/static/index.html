<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GravityDesk Minimalist UI</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --card-border: #1e293b;
      --card-hover: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --user-bubble: #312e81;
      --user-border: #4338ca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      background: rgba(21, 29, 48, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
    }
    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    .vitals-pill {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(30, 41, 59, 0.6);
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .vitals-pill span { color: var(--text); font-weight: 700; }

    /* Sub-header Navigation */
    .subbar {
      background: #0f172a;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      gap: 8px;
    }

    .folder-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      max-width: 60%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .mode-toggle-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--card-border);
      cursor: pointer;
    }

    /* Main Feed / Stream Container */
    #feed-container {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    /* Agent Info Card */
    .agent-hero-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(56, 189, 248, 0.05));
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .agent-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .agent-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .agent-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .session-toggle-btn {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: 0.15s;
    }
    .btn-start { background: var(--primary); color: #fff; }
    .btn-stop { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    /* Feed Messages */
    .msg-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text);
      word-break: break-word;
      animation: fadeIn 0.2s ease-out;
    }

    .user-bubble {
      align-self: flex-end;
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      color: #e0e7ff;
      border-radius: 14px 14px 2px 14px;
      max-width: 85%;
      padding: 10px 14px;
      font-weight: 500;
    }

    .agent-bubble {
      align-self: flex-start;
      border-radius: 14px 14px 14px 2px;
      max-width: 95%;
      width: 100%;
    }

    .msg-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Clean Code & Output blocks inside messages */
    .code-block {
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      font-family: "SF Mono", Consolas, Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #38bdf8;
      overflow-x: auto;
      margin: 6px 0;
      white-space: pre-wrap;
    }

    /* Confirmation Action Card */
    .confirm-card {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .confirm-title {
      font-size: 12px;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .confirm-actions {
      display: flex;
      gap: 8px;
    }
    .confirm-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-align: center;
    }
    .btn-yes { background: var(--success); color: #fff; }
    .btn-no { background: var(--danger); color: #fff; }

    /* Raw Terminal Container (hidden by default) */
    #raw-terminal {
      display: none;
      flex: 1;
      background: #050811;
      padding: 10px;
      overflow-y: auto;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #94a3b8;
      white-space: pre-wrap;
    }

    /* Floating Quick Bar */
    .quick-bar {
      background: #0f172a;
      padding: 6px 12px;
      display: flex;
      gap: 6px;
      border-top: 1px solid var(--card-border);
      overflow-x: auto;
    }
    .quick-pill {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .quick-pill:active { background: var(--primary); color: #fff; }
    .pill-sigint { border-color: rgba(239, 68, 68, 0.4); color: var(--danger); }

    /* Input Dock */
    .dock {
      background: var(--card);
      border-top: 1px solid var(--card-border);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .mic-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
    }
    .mic-btn.recording {
      background: var(--danger);
      color: #fff;
      animation: pulse 1.2s infinite;
    }

    .prompt-box {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .prompt-box:focus { border-color: var(--primary); }

    .send-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 16px;
      height: 42px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Workspace Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-sheet {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-top {
      padding: 14px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }
    .modal-content {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }
    .folder-item {
      padding: 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .folder-item:hover { background: #1e293b; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand-group">
      <span class="status-dot" id="status-dot"></span>
      <span class="brand-title">⚡ GravityDesk</span>
    </div>
    <div class="vitals-pill">
      <div>CPU: <span id="v-cpu">-</span></div>
      <div>RAM: <span id="v-ram">-</span></div>
      <div>Bat: <span id="v-bat">-</span></div>
    </div>
  </header>

  <!-- Subbar: Active Folder & View Switcher -->
  <div class="subbar">
    <div class="folder-chip" onclick="openWorkspaceModal()">
      📁 <span id="cur-folder">Select Workspace</span>
    </div>
    <button class="mode-toggle-btn" id="view-mode-btn" onclick="toggleViewMode()">
      🖥️ Raw View
    </button>
  </div>

  <!-- Minimalist Feed View -->
  <div id="feed-container">
    <div class="agent-hero-card">
      <div class="agent-info">
        <div class="agent-name">
          <span>Anti-Gravity (agy)</span>
          <span style="font-size: 10px; background: rgba(56, 189, 248, 0.2); color: #38bdf8; padding: 2px 6px; border-radius: 6px;">Gemini 3.8 Flash</span>
        </div>
        <div class="agent-meta" id="agent-status-line">Status: Ready & Listening</div>
      </div>
      <button id="session-btn" class="session-toggle-btn btn-start" onclick="toggleSession()">Start</button>
    </div>

    <!-- Active Tool Confirmation (shown dynamically when agy prompts) -->
    <div id="confirm-box" class="confirm-card" style="display: none;">
      <div class="confirm-title">⚠️ Approval Requested by agy CLI</div>
      <div id="confirm-msg" style="font-size: 12px; color: #cbd5e1;">Do you want to proceed with tool execution?</div>
      <div class="confirm-actions">
        <button class="confirm-btn btn-yes" onclick="sendPromptDirect('y\n')">✓ Approve (y)</button>
        <button class="confirm-btn btn-no" onclick="sendPromptDirect('n\n')">✕ Reject (n)</button>
      </div>
    </div>

    <!-- Dynamic Message Stream -->
    <div id="messages-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
  </div>

  <!-- Raw Terminal Fallback View -->
  <div id="raw-terminal"></div>

  <!-- Quick Shortcut Toolbar -->
  <div class="quick-bar">
    <button class="quick-pill pill-sigint" onclick="sendSignal('SIGINT')">Stop (Ctrl+C)</button>
    <button class="quick-pill" onclick="sendPromptDirect('y\n')">Yes (y)</button>
    <button class="quick-pill" onclick="sendPromptDirect('n\n')">No (n)</button>
    <button class="quick-pill" onclick="sendPromptDirect('\n')">Enter ↵</button>
    <button class="quick-pill" onclick="clearFeed()">Clear Feed</button>
  </div>

  <!-- Floating Input Dock -->
  <div class="dock">
    <button id="mic-btn" class="mic-btn" title="Voice Input" onclick="toggleMic()">🎙️</button>
    <input type="text" id="prompt-input" class="prompt-box" placeholder="Speak or type prompt for agy..." autocomplete="off" />
    <button class="send-btn" onclick="handleSend()">Send</button>
  </div>

  <!-- Folder Modal -->
  <div id="workspace-modal" class="modal">
    <div class="modal-sheet">
      <div class="modal-top">
        <span>Workspace Explorer</span>
        <button onclick="closeWorkspaceModal()" style="background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div class="modal-content">
        <div style="font-size: 11px; font-weight:700; color: var(--text-muted); margin-bottom: 6px;">FAVORITES</div>
        <div id="fav-list" style="display:flex; flex-direction:column; gap:4px; margin-bottom: 12px;"></div>
        <div style="font-size: 11px; font-weight:700; color: var(--text-muted); margin-bottom: 6px;">DRIVES & FOLDERS</div>
        <div id="bc-bar" style="font-size: 12px; color: var(--accent); margin-bottom: 8px;"></div>
        <div id="dir-list" style="display:flex; flex-direction:column; gap:2px;"></div>
      </div>
      <div style="padding: 12px; border-top: 1px solid var(--card-border); display:flex; justify-content:space-between;">
        <button class="mode-toggle-btn" onclick="toggleFavoritePin()">⭐ Pin Favorite</button>
        <button class="send-btn" style="height:36px;" onclick="chooseCurrentFolder()">Select Folder</button>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let currentSeq = 0;
    let activePath = "";
    let isSessionRunning = false;
    let token = new URLSearchParams(window.location.search).get("token") || "";
    let isRawMode = false;

    const statusDot = document.getElementById("status-dot");
    const feedContainer = document.getElementById("feed-container");
    const messagesList = document.getElementById("messages-list");
    const rawTerminal = document.getElementById("raw-terminal");
    const promptInput = document.getElementById("prompt-input");
    const curFolderEl = document.getElementById("cur-folder");
    const sessionBtn = document.getElementById("session-btn");
    const agentStatusLine = document.getElementById("agent-status-line");
    const confirmBox = document.getElementById("confirm-box");
    const confirmMsg = document.getElementById("confirm-msg");
    const micBtn = document.getElementById("mic-btn");

    // Clean Noise Filtering (Strip OSC, Title codes, and ASCII logo distortion)
    function sanitizeTerminalText(raw) {
      if (!raw) return "";
      return raw
        // Strip OSC Window Title escape codes (e.g. ]0;cmd.exe\x07)
        .replace(/(\x1B\]|\x9D)[0-9;]*[^\x07\x1B\r\n]*(\x07|\x1B\\)?/g, "")
        // Strip other control escape sequences
        .replace(/\x1B\[[0-9;?]*[a-zA-Z]/g, "")
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
    }

    function connectWS() {
      const loc = window.location;
      const proto = loc.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${proto}//${loc.host}/ws/terminal?token=${token}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusDot.className = "status-dot online";
        ws.send(JSON.stringify({ type: "subscribe", last_seq: currentSeq }));
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "output") {
          currentSeq = msg.seq;
          handleIncomingChunk(msg.data);
        } else if (msg.type === "status") {
          isSessionRunning = msg.state === "RUNNING";
          updateSessionUI();
        }
      };

      ws.onclose = () => {
        statusDot.className = "status-dot";
        setTimeout(connectWS, 2000);
      };

      ws.onerror = () => ws.close();
    }

    let currentAgentCard = null;
    let currentAgentPre = null;

    function handleIncomingChunk(raw) {
      // Feed to raw terminal buffer regardless
      rawTerminal.textContent += raw;
      if (isRawMode) {
        rawTerminal.scrollTop = rawTerminal.scrollHeight;
      }

      // Minimalist Clean Processing
      const clean = sanitizeTerminalText(raw);
      if (!clean.trim()) return;

      // Filter out raw ASCII avatar noise or desktop divider lines
      if (clean.includes("bagasss2077") || clean.includes("Downloads/GravityDesk") || clean.includes("Gemini 3.8 Flash")) {
        agentStatusLine.innerText = "Active Model: Gemini 3.8 Flash (High)";
        return;
      }

      // Detect confirmation prompts (e.g. [y/n] or Proceed?)
      if (/(\[y\/n\]|\(y\/n\)|proceed\?|approve\?)/i.test(clean)) {
        confirmMsg.innerText = clean.trim();
        confirmBox.style.display = "flex";
      } else if (confirmBox.style.display !== "none" && /(running|done|executing|cancelled)/i.test(clean)) {
        confirmBox.style.display = "none";
      }

      // Skip lines that are purely horizontal dividers (----------------)
      if (/^[-=_~]{4,}$/.test(clean.trim())) {
        return;
      }

      // Append cleanly to current agent card
      if (!currentAgentCard) {
        currentAgentCard = document.createElement("div");
        currentAgentCard.className = "msg-card agent-bubble";
        currentAgentCard.innerHTML = `<div class="msg-header"><span>🤖 Anti-Gravity Response</span></div>`;
        currentAgentPre = document.createElement("div");
        currentAgentPre.className = "code-block";
        currentAgentCard.appendChild(currentAgentPre);
        messagesList.appendChild(currentAgentCard);
      }

      currentAgentPre.textContent += clean;
      feedContainer.scrollTop = feedContainer.scrollHeight;
    }

    function handleSend() {
      const text = promptInput.value.trim();
      if (!text) return;

      // Render clean user bubble in feed
      const userBubble = document.createElement("div");
      userBubble.className = "msg-card user-bubble";
      userBubble.textContent = text;
      messagesList.appendChild(userBubble);

      // Reset agent card pointer so new output creates a fresh card
      currentAgentCard = null;
      currentAgentPre = null;
      confirmBox.style.display = "none";

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "stdin", data: text + "\r\n" }));
      }

      promptInput.value = "";
      feedContainer.scrollTop = feedContainer.scrollHeight;
    }

    function sendPromptDirect(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "stdin", data: data }));
      }
      confirmBox.style.display = "none";
    }

    function sendSignal(sig) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "signal", signal: sig }));
      }
    }

    function clearFeed() {
      messagesList.innerHTML = "";
      rawTerminal.textContent = "";
      currentAgentCard = null;
      currentAgentPre = null;
    }

    function toggleViewMode() {
      isRawMode = !isRawMode;
      const btn = document.getElementById("view-mode-btn");
      if (isRawMode) {
        feedContainer.style.display = "none";
        rawTerminal.style.display = "block";
        btn.innerText = "✨ Clean UI";
        rawTerminal.scrollTop = rawTerminal.scrollHeight;
      } else {
        rawTerminal.style.display = "none";
        feedContainer.style.display = "flex";
        btn.innerText = "🖥️ Raw View";
        feedContainer.scrollTop = feedContainer.scrollHeight;
      }
    }

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    // Telemetry Polling
    async function fetchVitals() {
      try {
        const res = await fetch(`/api/health?token=${token}`);
        if (res.ok) {
          const d = await res.json();
          document.getElementById("v-cpu").innerText = `${d.cpu_percent}%`;
          document.getElementById("v-ram").innerText = `${d.memory_percent}%`;
          if (d.battery) {
            const bolt = d.battery.is_charging ? "⚡" : "";
            document.getElementById("v-bat").innerText = `${bolt}${d.battery.percent}%`;
          }
          if (d.active_session) {
            isSessionRunning = d.active_session.is_alive;
            updateSessionUI();
            if (d.active_session.cwd && !activePath) {
              activePath = d.active_session.cwd;
              updateFolderDisplay(activePath);
            }
          }
        }
      } catch (err) {}
    }

    function updateFolderDisplay(path) {
      const name = path.split(/[\\/]/).filter(Boolean).pop() || path;
      curFolderEl.innerText = name;
      curFolderEl.title = path;
    }

    function updateSessionUI() {
      if (isSessionRunning) {
        sessionBtn.innerText = "Stop";
        sessionBtn.className = "session-toggle-btn btn-stop";
        agentStatusLine.innerText = "Session Active";
      } else {
        sessionBtn.innerText = "Start";
        sessionBtn.className = "session-toggle-btn btn-start";
        agentStatusLine.innerText = "Session Stopped";
      }
    }

    async function toggleSession() {
      if (isSessionRunning) {
        await fetch(`/api/session/stop?token=${token}`, { method: "POST" });
      } else {
        await fetch(`/api/session/start?token=${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cwd: activePath }),
        });
      }
      fetchVitals();
    }

    // Voice STT
    let recognition = null;
    let isRecording = false;

    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = "id-ID";

      recognition.onresult = (e) => {
        let t = "";
        for (let i = e.resultIndex; i < e.results.length; ++i) t += e.results[i][0].transcript;
        promptInput.value = t;
      };
      recognition.onend = () => stopMic();
      recognition.onerror = () => stopMic();
    } else {
      micBtn.style.display = "none";
    }

    function toggleMic() {
      if (!recognition) return;
      if (isRecording) {
        recognition.stop();
        stopMic();
      } else {
        recognition.start();
        isRecording = true;
        micBtn.classList.add("recording");
      }
    }
    function stopMic() {
      isRecording = false;
      micBtn.classList.remove("recording");
    }

    // Workspace Modal
    let modalNavPath = "";
    async function openWorkspaceModal() {
      document.getElementById("workspace-modal").classList.add("open");
      loadFavorites();
      loadDirectory(activePath || "");
    }
    function closeWorkspaceModal() {
      document.getElementById("workspace-modal").classList.remove("open");
    }

    async function loadFavorites() {
      const res = await fetch(`/api/favorites?token=${token}`);
      const favs = await res.json();
      const listEl = document.getElementById("fav-list");
      listEl.innerHTML = "";
      favs.forEach((f) => {
        const div = document.createElement("div");
        div.className = "folder-item";
        div.innerHTML = `⭐ <b>${f.name}</b> <span style="font-size:11px;color:var(--text-muted);margin-left:auto">${f.path}</span>`;
        div.onclick = () => {
          activePath = f.path;
          updateFolderDisplay(activePath);
          closeWorkspaceModal();
        };
        listEl.appendChild(div);
      });
    }

    async function loadDirectory(p) {
      const res = await fetch(`/api/workspaces?path=${encodeURIComponent(p)}&token=${token}`);
      const data = await res.json();
      modalNavPath = data.current_path;

      const bcEl = document.getElementById("bc-bar");
      bcEl.innerHTML = "";
      data.breadcrumbs.forEach((b, i) => {
        const span = document.createElement("span");
        span.style.cursor = "pointer";
        span.innerText = b.name + (i < data.breadcrumbs.length - 1 ? " / " : "");
        span.onclick = () => loadDirectory(b.path);
        bcEl.appendChild(span);
      });

      const dirEl = document.getElementById("dir-list");
      dirEl.innerHTML = "";
      data.entries.forEach((entry) => {
        const div = document.createElement("div");
        div.className = "folder-item";
        div.innerHTML = `📁 <span>${entry.name}</span>`;
        div.onclick = () => loadDirectory(entry.path);
        dirEl.appendChild(div);
      });
    }

    function chooseCurrentFolder() {
      activePath = modalNavPath;
      updateFolderDisplay(activePath);
      closeWorkspaceModal();
    }

    async function toggleFavoritePin() {
      await fetch(`/api/favorites/toggle?path=${encodeURIComponent(modalNavPath)}&token=${token}`, { method: "POST" });
      loadFavorites();
    }

    // Init
    window.addEventListener("DOMContentLoaded", () => {
      connectWS();
      fetchVitals();
      setInterval(fetchVitals, 3000);
    });
  </script>
</body>
</html>
